<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduGen Portal</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-glow bg-glow-a"></div>
  <div class="bg-glow bg-glow-b"></div>

  <main class="shell">
    <header class="topbar">
      <h1>EduGen</h1>
      <div id="sessionBox" class="session-box hidden">
        <span id="sessionText"></span>
        <button id="logoutBtn" class="btn btn-light">Logout</button>
      </div>
    </header>

    <section id="authPanel" class="panel auth-grid">
      <div class="card">
        <h2>Register</h2>
        <label>Username</label>
        <input id="regUsername" type="text" placeholder="username" />
        <label>Password</label>
        <input id="regPassword" type="password" placeholder="password" />
        <label>Role</label>
        <select id="regRole">
          <option value="student">Student</option>
          <option value="instructor">Instructor</option>
        </select>
        <button id="registerBtn" class="btn">Create Account</button>
      </div>

      <div class="card">
        <h2>Login</h2>
        <label>Username</label>
        <input id="loginUsername" type="text" placeholder="username" />
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="password" />
        <button id="loginBtn" class="btn">Login</button>
      </div>
    </section>

    <section id="appPanel" class="panel hidden">
      <div class="tabs">
        <button class="tab active" data-tab="instructorTab">Instructor</button>
        <button class="tab" data-tab="studentTab">Student</button>
      </div>

      <div id="instructorTab" class="tab-panel">
        <div class="grid">
          <div class="card">
            <h3>Generate Exam</h3>
            <label>Topic</label>
            <input id="genTopic" type="text" placeholder="Operating Systems" />
            <label>Difficulty</label>
            <select id="genDifficulty">
              <option>Beginner</option>
              <option>Intermediate</option>
              <option>Advanced</option>
            </select>
            <label>MCQ count</label>
            <input id="genMcqCount" type="number" min="1" max="20" value="3" />
            <label>Essay count</label>
            <input id="genEssayCount" type="number" min="0" max="10" value="2" />
            <button id="generateBtn" class="btn">Generate</button>
          </div>

          <div class="card">
            <h3>Create Exam</h3>
            <label>Topic</label>
            <input id="createTopic" type="text" placeholder="Operating Systems" />
            <label>Difficulty</label>
            <input id="createDifficulty" type="text" value="Beginner" />
            <label>Status</label>
            <select id="createStatus">
              <option value="draft">draft</option>
              <option value="published">published</option>
              <option value="archived">archived</option>
            </select>
            <label>Due at (optional)</label>
            <input id="createDueAt" type="datetime-local" />
            <label>Rubric (optional)</label>
            <textarea id="createRubric" rows="2"></textarea>
            <label>Exam JSON/Text</label>
            <textarea id="createContent" rows="10" placeholder='{"topic":"..."}'></textarea>
            <button id="createExamBtn" class="btn">Save Exam</button>
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <h3>My Exams</h3>
            <button id="loadMyExamsBtn" class="btn btn-light">Refresh</button>
            <div id="myExamsList" class="list"></div>
          </div>
          <div class="card">
            <h3>Submissions To Grade</h3>
            <button id="loadSubmissionsBtn" class="btn btn-light">Refresh</button>
            <div id="submissionsList" class="list"></div>
          </div>
        </div>
      </div>

      <div id="studentTab" class="tab-panel hidden">
        <div class="card">
          <h3>Published Exams</h3>
          <button id="loadPublishedBtn" class="btn btn-light">Refresh</button>
          <div id="publishedList" class="list"></div>
        </div>
        <div id="examWorkArea" class="card hidden"></div>
      </div>
    </section>

    <section class="panel">
      <h3>Response Log</h3>
      <pre id="logBox" class="log"></pre>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
